#psql docker compose file

services:
  postgres_db:
    image: postgres:latest
    container_name: hl_postgres_db
    restart: always
    environment:
      POSTGRES_USER: hl_admin
      POSTGRES_PASSWORD: hl_password
      POSTGRES_DB: human_labs
    ports:
      - "5432:5432"
    volumes:
      - db_hl_data:/var/lib/postgresql

volumes:
  db_hl_data: